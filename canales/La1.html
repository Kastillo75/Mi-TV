<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La 1</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

</style>

</head>

<body>

<video
    id="video"
    controls
    autoplay
    playsinline>
</video>

<script>

const video = document.getElementById("video");

video.src =
    "https://rtvelivestream.rtve.es/rtvesec/la1/la1_main.m3u8";

video.play().catch(function(error) {
    console.log("Autoplay bloqueado:", error);
});


/* VOLVER AL MENÚ */

document.addEventListener("keydown", function(e) {

    if (
        e.key === "Escape" ||
        e.key === "Backspace"
    ) {

        e.preventDefault();

        window.history.back();

    }

});

</script>

</body>
</html>
