
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Antena 3</title>

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: black;
    color: white;

    font-family: Arial, sans-serif;
}


/* MENSAJE MIENTRAS BUSCA LA EMISIÓN */

#mensaje {

    position: fixed;

    inset: 0;

    display: flex;

    justify-content: center;
    align-items: center;

    background: #111;

    font-size: 26px;

    text-align: center;

    z-index: 10;
}


/* REPRODUCTOR */

#reproductor {

    display: none;

    position: fixed;

    inset: 0;

    background: black;
}


#video {

    width: 100%;
    height: 100%;

    object-fit: contain;
}

</style>

</head>


<body>


<!-- MENSAJE -->

<div id="mensaje">
    Buscando emisión de Antena 3...
</div>


<!-- REPRODUCTOR -->

<div id="reproductor">

    <video
        id="video"
        controls
        autoplay
        playsinline>
    </video>

</div>


<script>

const mensaje =
    document.getElementById("mensaje");

const reproductor =
    document.getElementById("reproductor");

const video =
    document.getElementById("video");


/*
==================================================
WORKER CLOUDFLARE
==================================================
*/

const WORKER_URL =
    "https://mi-tv-antena3.jjavierfontanero.workers.dev/";


/*
==================================================
INICIAR AUTOMÁTICAMENTE
==================================================
*/

async function iniciar() {

    try {

        /*
        1. PEDIR AL WORKER LA URL ACTUAL
        DE ANTENA 3
        */

        const respuesta =
            await fetch(WORKER_URL);

        if (!respuesta.ok) {

            throw new Error(
                "El Worker no responde: HTTP "
                + respuesta.status
            );

        }


        /*
        2. LEER RESPUESTA
        */

        const datos =
            await respuesta.json();


        console.log(
            "Respuesta del Worker:",
            datos
        );


        /*
        3. COMPROBAR URL
        */

        if (
            !datos.ok ||
            !datos.url
        ) {

            throw new Error(
                datos.error ||
                "El Worker no ha devuelto una emisión"
            );

        }


        console.log(
            "URL Antena 3:",
            datos.url
        );


        /*
        4. MOSTRAR REPRODUCTOR
        */

        mensaje.style.display = "none";

        reproductor.style.display = "block";


        /*
        5. REPRODUCIR
        */

        video.src = datos.url;

        video.load();


        try {

            await video.play();

        }

        catch (error) {

            console.log(
                "Autoplay bloqueado:",
                error
            );

        }

    }


    catch (error) {

        console.error(error);

        mensaje.innerHTML =
            "❌ No se ha podido obtener la emisión de Antena 3.";

    }

}


/*
==================================================
ARRANCAR
==================================================
*/

iniciar();


/*
==================================================
ESC / ATRÁS → VOLVER AL MENÚ
==================================================
*/

document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.key === "Escape" ||
            e.key === "Backspace"
        ) {

            e.preventDefault();

            video.pause();

            video.removeAttribute("src");

            video.load();

            window.history.back();

        }

    }
);

</script>


</body>

</html>
