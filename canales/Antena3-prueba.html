<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Antena 3 - Mi TV</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      font-family: Arial, sans-serif;
    }

    .contenedor {
      width: 100%;
      height: 100vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .volver {
      position: fixed;
      top: 15px;
      left: 15px;
      padding: 10px 16px;
      background: rgba(30, 30, 30, 0.9);
      color: white;
      border: 1px solid #777;
      border-radius: 7px;
      text-decoration: none;
      font-size: 16px;
      z-index: 20;
    }

    .estado {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      z-index: 10;
    }
  </style>
</head>

<body>

  <a class="volver" href="../index.html">
    ← Volver
  </a>

  <div class="contenedor">

    <video
      id="video"
      controls
      autoplay
      playsinline>
    </video>

  </div>

  <div id="estado" class="estado">
    Obteniendo señal de Antena 3...
  </div>

  <script>

    const WORKER =
      "https://mi-tv-antena3.jjavierfontanero.workers.dev/";

    const video =
      document.getElementById("video");

    const estado =
      document.getElementById("estado");


    async function iniciar() {

      try {

        estado.textContent =
          "Obteniendo señal de Antena 3...";


        // 1. Pedimos al Worker una URL nueva
        const respuesta =
          await fetch(WORKER);

        if (!respuesta.ok) {
          throw new Error(
            "Worker HTTP " + respuesta.status
          );
        }


        // 2. Leer JSON
        const datos =
          await respuesta.json();


        if (!datos.ok || !datos.url) {
          throw new Error(
            datos.error || "El Worker no devolvió señal"
          );
        }


        console.log(
          "Fuente obtenida:",
          datos.tipo,
          datos.dominio
        );


        estado.textContent =
          "Conectando con Antena 3...";


        // 3. Reproducir HLS
        if (Hls.isSupported()) {

          const hls = new Hls({
            enableWorker: true,
            lowLatencyMode: false
          });

          const urlProxy =
           WORKER +
           "stream?url=" +
          encodeURIComponent(datos.url);

hls.loadSource(urlProxy);

          hls.attachMedia(video);


          hls.on(
            Hls.Events.MANIFEST_PARSED,
            function () {

              estado.textContent =
                "Antena 3 en directo";

              video.play().catch(() => {});

            }
          );


          hls.on(
            Hls.Events.ERROR,
            function (event, data) {

              console.error(
                "HLS ERROR:",
                data
              );

              estado.textContent =
                "Error reproduciendo la señal";
            }
          );


        } else if (
          video.canPlayType(
            "application/vnd.apple.mpegurl"
          )
        ) {

          video.src = datos.url;

          video.addEventListener(
            "loadedmetadata",
            function () {

              estado.textContent =
                "Antena 3 en directo";

              video.play().catch(() => {});

            }
          );

        } else {

          throw new Error(
            "Este navegador no soporta HLS"
          );
        }


      } catch (error) {

        console.error(error);

        estado.textContent =
          "Error: " + error.message;
      }

    }


    iniciar();

  </script>

</body>
</html>
