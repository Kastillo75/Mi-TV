<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Antena 3</title>

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: black;
    color: white;

    font-family: Arial, sans-serif;
}

#mensaje {
    position: fixed;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #111;

    font-size: 26px;
    text-align: center;

    z-index: 10;
}

#reproductor {
    display: none;

    position: fixed;
    inset: 0;

    background: black;
}

#video {
    width: 100%;
    height: 100%;

    object-fit: contain;
}

</style>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

</head>

<body>

<div id="mensaje">
    Buscando emisión de Antena 3...
</div>

<div id="reproductor">

    <video
        id="video"
        controls
        autoplay
        playsinline>
    </video>

</div>

<script>

const mensaje =
    document.getElementById("mensaje");

const reproductor =
    document.getElementById("reproductor");

const video =
    document.getElementById("video");


const WORKER_URL =
    "https://mi-tv-antena3.jjavierfontanero.workers.dev/";


async function iniciar() {

    try {

        console.log("Consultando Worker...");


        const respuesta =
            await fetch(WORKER_URL);


        if (!respuesta.ok) {

            throw new Error(
                "El Worker no responde: HTTP "
                + respuesta.status
            );

        }


        const datos =
            await respuesta.json();


        console.log(
            "Respuesta del Worker:",
            datos
        );


        if (
            !datos.ok ||
            !datos.url
        ) {

            throw new Error(
                datos.error ||
                "El Worker no ha devuelto una emisión"
            );

        }


        console.log(
            "URL HLS:",
            datos.url
        );


        mensaje.style.display = "none";

        reproductor.style.display = "block";


        if (Hls.isSupported()) {

            console.log(
                "Usando hls.js"
            );


            const hls =
                new Hls();


            hls.loadSource(
                datos.url
            );


            hls.attachMedia(
                video
            );


            hls.on(
                Hls.Events.MANIFEST_PARSED,
                function() {

                    console.log(
                        "HLS cargado correctamente"
                    );


                    video.play().catch(
                        function(error) {

                            console.log(
                                "Autoplay bloqueado:",
                                error
                            );

                        }
                    );

                }
            );


            hls.on(
                Hls.Events.ERROR,
                function(
                    event,
                    data
                ) {

                    console.error(
                        "ERROR HLS:",
                        data
                    );

                }
            );

        }

        else if (
            video.canPlayType(
                "application/vnd.apple.mpegurl"
            )
        ) {

            console.log(
                "Usando HLS nativo"
            );


            video.src =
                datos.url;


            video.addEventListener(
                "loadedmetadata",
                function() {

                    video.play().catch(
                        function(error) {

                            console.log(
                                "Autoplay bloqueado:",
                                error
                            );

                        }
                    );

                },
                {
                    once: true
                }
            );

        }

        else {

            throw new Error(
                "Este navegador no soporta HLS"
            );

        }

    }

    catch (error) {

        console.error(
            "ERROR:",
            error
        );


        mensaje.innerHTML =
            "❌ Error: "
            + error.message;

    }

}


iniciar();


document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.key === "Escape" ||
            e.key === "Backspace"
        ) {

            e.preventDefault();


            video.pause();

            video.removeAttribute(
                "src"
            );

            video.load();


            window.history.back();

        }

    }
);

</script>

</body>

</html>
