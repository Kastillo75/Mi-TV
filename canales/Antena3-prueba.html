<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Antena 3 - Prueba</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

h1 {
    margin: 20px;
}

#video {
    width: 90%;
    max-width: 1100px;
    display: block;
    margin: 20px auto;
    background: black;
}

#log {
    width: 90%;
    max-width: 1100px;
    margin: 20px auto;
    padding: 15px;
    box-sizing: border-box;
    background: #222;
    white-space: pre-wrap;
    font-family: Consolas, monospace;
    font-size: 13px;
}
</style>

</head>

<body>

<h1>Antena 3 - Prueba</h1>

<video
    id="video"
    controls
    playsinline>
</video>

<div id="log"></div>

<script>

const WORKER =
    "https://mi-tv-antena3.jjavierfontanero.workers.dev";

const video =
    document.getElementById("video");

const logDiv =
    document.getElementById("log");

function log(text) {

    console.log(text);

    logDiv.textContent +=
        text + "\n";
}


async function iniciar() {

    try {

        log("Consultando Worker...");

        const respuesta =
            await fetch(
                WORKER,
                {
                    cache: "no-store"
                }
            );

        if (!respuesta.ok) {

            throw new Error(
                "Worker HTTP " +
                respuesta.status
            );
        }

        const datos =
            await respuesta.json();

        log(
            "Fuente obtenida: " +
            datos.tipo
        );

        if (
            !datos.ok ||
            !datos.url
        ) {

            throw new Error(
                datos.error ||
                "El Worker no devolvió URL"
            );
        }

        log(
            "Sesión Broadpeak: " +
            (datos.sesion ? "OK" : "NO")
        );


        /*
         * URL de sesión obtenida por el Worker.
         */
        const urlSesion =
            datos.url;


        /*
         * TODO pasa por nuestro Worker.
         */
        const urlProxy =
            WORKER +
            "/stream?url=" +
            encodeURIComponent(
                urlSesion
            );


        log(
            "URL proxy preparada."
        );

        log(
            "Forzando Hls.js..."
        );


        /*
         * NO usamos HLS nativo.
         */
        if (!Hls.isSupported()) {

            throw new Error(
                "Hls.js no está soportado en este navegador."
            );
        }


        const hls =
            new Hls({

                enableWorker: true,

                lowLatencyMode: true,

                backBufferLength: 30,

                manifestLoadingMaxRetry: 2,

                manifestLoadingRetryDelay: 1000,

                levelLoadingMaxRetry: 2,

                levelLoadingRetryDelay: 1000

            });


        hls.on(
            Hls.Events.MEDIA_ATTACHED,
            () => {

                log(
                    "Vídeo conectado a Hls.js."
                );
            }
        );


        hls.on(
            Hls.Events.MANIFEST_LOADING,
            (event, data) => {

                log(
                    "Cargando manifest..."
                );

                console.log(
                    "MANIFEST URL:",
                    data.url
                );
            }
        );


        hls.on(
            Hls.Events.MANIFEST_LOADED,
            (event, data) => {

                log(
                    "Manifest recibido."
                );

                console.log(
                    "MANIFEST:",
                    data
                );
            }
        );


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            (event, data) => {

                log(
                    "Manifest interpretado."
                );

                log(
                    "Calidades: " +
                    data.levels.length
                );

                video.play()
                    .then(() => {

                        log(
                            "REPRODUCCIÓN INICIADA."
                        );

                    })
                    .catch(error => {

                        log(
                            "Play bloqueado: " +
                            error.message
                        );

                    });
            }
        );


        hls.on(
            Hls.Events.LEVEL_LOADING,
            (event, data) => {

                console.log(
                    "LEVEL_LOADING:",
                    data.url
                );
            }
        );


        hls.on(
            Hls.Events.LEVEL_LOADED,
            (event, data) => {

                log(
                    "Playlist de vídeo recibida."
                );

                console.log(
                    "LEVEL_LOADED:",
                    data
                );
            }
        );


        hls.on(
            Hls.Events.FRAG_LOADING,
            (event, data) => {

                console.log(
                    "SEGMENTO:",
                    data.frag?.url
                );
            }
        );


        hls.on(
            Hls.Events.FRAG_LOADED,
            () => {

                log(
                    "Segmento recibido."
                );
            }
        );


        hls.on(
            Hls.Events.ERROR,
            (event, data) => {

                console.error(
                    "HLS ERROR:",
                    data
                );

                log(
                    "HLS ERROR: " +
                    data.details
                );

                if (data.response) {

                    log(
                        "HTTP: " +
                        data.response.code
                    );

                    log(
                        "URL: " +
                        data.response.url
                    );

                    log(
                        "Datos recibidos: " +
                        (
                            data.response.data
                                ? data.response.data.length
                                : 0
                        )
                    );
                }

                if (data.fatal) {

                    log(
                        "ERROR HLS FATAL."
                    );
                }
            }
        );


        /*
         * Cargamos SIEMPRE mediante Worker.
         */
        hls.loadSource(
            urlProxy
        );

        hls.attachMedia(
            video
        );

        log(
            "Hls.js iniciado."
        );


    } catch (error) {

        console.error(error);

        log(
            "ERROR: " +
            (
                error?.message ||
                String(error)
            )
        );
    }
}


iniciar();

</script>

</body>
</html>
