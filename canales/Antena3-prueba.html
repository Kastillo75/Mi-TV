<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Antena 3 - Prueba</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .contenedor {
      width: 100%;
      max-width: 700px;
      padding: 30px;
      text-align: center;
    }

    h1 {
      margin: 0 0 15px;
      font-size: 28px;
    }

    p {
      margin: 0 0 25px;
      color: #ccc;
      line-height: 1.5;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 15px 28px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: #fff;
      color: #000;
    }

    button:hover {
      opacity: 0.85;
    }

    .info {
      margin-top: 25px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>Antena 3</h1>

    <p>
      Esta es la prueba de acceso directo al reproductor oficial
      de Atresplayer.
    </p>

    <button id="abrir">
      ABRIR ANTENA 3
    </button>

    <div class="info">
      La primera vez tendrás que iniciar sesión o registrarte.
      Después el navegador debería conservar la sesión.
    </div>

  </div>


  <script>

    const URL_ANTENA3 =
      "https://www.atresplayer.com/directos/antena3/";


    document
      .getElementById("abrir")
      .addEventListener(
        "click",
        function () {

          /*
           * Navegamos directamente al reproductor
           * oficial de Antena 3.
           *
           * No usamos Worker.
           * No usamos Hls.js.
           * No usamos iframe.
           */

          window.location.href =
            URL_ANTENA3;

        }
      );

  </script>

</body>
</html>
