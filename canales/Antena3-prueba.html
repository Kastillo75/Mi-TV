<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Antena 3 - Prueba</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

h1 {
    margin: 20px;
}

#video {
    width: 90%;
    max-width: 1100px;
    display: block;
    margin: 20px auto;
    background: black;
}

#log {
    width: 90%;
    max-width: 1100px;
    margin: 20px auto;
    padding: 15px;
    background: #222;
    box-sizing: border-box;
    white-space: pre-wrap;
    font-family: Consolas, monospace;
    font-size: 13px;
}

</style>

</head>

<body>

<h1>Antena 3 - Prueba</h1>

<video
    id="video"
    controls
    autoplay
    playsinline>
</video>

<div id="log"></div>


<script>

const WORKER =
    "https://mi-tv-antena3.jjavierfontanero.workers.dev";

const video =
    document.getElementById("video");

const logDiv =
    document.getElementById("log");


function log(text) {

    console.log(text);

    logDiv.textContent +=
        text + "\n";
}


async function iniciar() {

    try {

        log("Consultando Worker...");

        const respuesta =
            await fetch(
                WORKER,
                {
                    cache: "no-store"
                }
            );

        if (!respuesta.ok) {

            throw new Error(
                "Worker HTTP " +
                respuesta.status
            );
        }

        const datos =
            await respuesta.json();

        log(
            "Fuente obtenida: " +
            datos.tipo
        );

        if (
            !datos.ok ||
            typeof datos.url !== "string" ||
            !datos.url
        ) {

            throw new Error(
                datos.error ||
                "El Worker no devolvió URL"
            );
        }


        /*
         * IMPORTANTE:
         *
         * La URL que devuelve ahora el Worker
         * ya contiene:
         *
         * bpkio_sessionid
         * bpkio_serviceid
         *
         * NO añadimos response=200.
         */


        const urlSesion =
            datos.url;


        log(
            "Sesión Broadpeak obtenida."
        );


        /*
         * El reproductor NO debe ir directamente
         * a Atresmedia.
         *
         * Lo hacemos pasar por nuestro Worker.
         */
        const urlProxy =
            WORKER +
            "/stream?url=" +
            encodeURIComponent(
                urlSesion
            );


        log(
            "Cargando HLS mediante Worker..."
        );


        if (
            video.canPlayType(
                "application/vnd.apple.mpegurl"
            )
        ) {

            log(
                "Reproducción HLS nativa."
            );

            video.src =
                urlProxy;

            video.addEventListener(
                "loadedmetadata",
                () => {

                    log(
                        "Metadata cargada."
                    );

                    video.play()
                        .catch(() => {});
                }
            );

        } else if (
            Hls.isSupported()
        ) {

            log(
                "Hls.js disponible."
            );

            const hls =
                new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 30
                });


            hls.on(
                Hls.Events.MANIFEST_LOADING,
                () => {

                    log(
                        "Cargando manifest..."
                    );
                }
            );


            hls.on(
                Hls.Events.MANIFEST_LOADED,
                () => {

                    log(
                        "Manifest recibido."
                    );
                }
            );


            hls.on(
                Hls.Events.MANIFEST_PARSED,
                () => {

                    log(
                        "Manifest interpretado correctamente."
                    );

                    video.play()
                        .catch(() => {});
                }
            );


            hls.on(
                Hls.Events.ERROR,
                (event, data) => {

                    console.error(
                        "HLS ERROR:",
                        data
                    );

                    log(
                        "HLS ERROR: " +
                        data.details
                    );

                    if (data.fatal) {

                        log(
                            "Error HLS fatal."
                        );
                    }
                }
            );


            hls.loadSource(
                urlProxy
            );

            hls.attachMedia(
                video
            );

        } else {

            throw new Error(
                "Este navegador no soporta HLS."
            );
        }


    } catch (error) {

        console.error(error);

        log(
            "ERROR: " +
            (
                error?.message ||
                String(error)
            )
        );
    }
}


iniciar();

</script>

</body>
</html>
