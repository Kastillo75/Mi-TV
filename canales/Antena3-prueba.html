<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Antena 3 - Prueba</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 15px 20px;
      background: #1c1c1c;
      border-bottom: 1px solid #333;
    }

    h1 {
      margin: 0;
      font-size: 20px;
    }

    #estado {
      padding: 12px 20px;
      background: #222;
      color: #ccc;
      font-size: 14px;
      white-space: pre-wrap;
    }

    .video-container {
      width: 100%;
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 15px;
    }

    video {
      width: 100%;
      display: block;
      background: black;
      aspect-ratio: 16 / 9;
    }

    #logs {
      width: 100%;
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 15px 30px;
    }

    #log {
      background: #050505;
      border: 1px solid #333;
      padding: 15px;
      min-height: 150px;
      max-height: 400px;
      overflow: auto;
      white-space: pre-wrap;
      font-family: Consolas, monospace;
      font-size: 12px;
      color: #ddd;
    }

  </style>

</head>

<body>

  <header>
    <h1>Antena 3 — Prueba de reproducción</h1>
  </header>

  <div id="estado">
    Iniciando...
  </div>

  <div class="video-container">

    <video
      id="video"
      controls
      autoplay
      playsinline
    ></video>

  </div>

  <div id="logs">

    <div id="log"></div>

  </div>


<script>

  // =========================================================
  // CONFIGURACIÓN
  // =========================================================

  const WORKER =
    "https://mi-tv-antena3.jjavierfontanero.workers.dev";


  const video =
    document.getElementById("video");

  const estado =
    document.getElementById("estado");

  const logElement =
    document.getElementById("log");


  // =========================================================
  // LOG
  // =========================================================

  function log(mensaje) {

    console.log(mensaje);

    logElement.textContent +=
      mensaje + "\n";

    logElement.scrollTop =
      logElement.scrollHeight;
  }


  // =========================================================
  // ESTADO
  // =========================================================

  function cambiarEstado(texto) {

    estado.textContent =
      texto;

    log(texto);
  }


  // =========================================================
  // INICIAR
  // =========================================================

  async function iniciar() {

    try {

      cambiarEstado(
        "Consultando Atresplayer..."
      );


      // -----------------------------------------------------
      // Obtener fuente
      // -----------------------------------------------------

      const respuesta =
        await fetch(
          WORKER,
          {
            cache: "no-store"
          }
        );


      if (!respuesta.ok) {

        const texto =
          await respuesta.text();

        throw new Error(
          "Worker HTTP " +
          respuesta.status +
          " - " +
          texto
        );
      }


      const datos =
        await respuesta.json();


      if (!datos.ok) {

        throw new Error(
          datos.error ||
          "El Worker no devolvió una fuente"
        );
      }


      log(
        "Fuente obtenida: " +
        datos.tipo
      );


      // -----------------------------------------------------
      // Comprobar URL
      // -----------------------------------------------------

      if (
        typeof datos.url !==
        "string" ||
        !datos.url
      ) {

        throw new Error(
          "El Worker no devolvió URL"
        );
      }


      // -----------------------------------------------------
      // URL HLS
      // -----------------------------------------------------

      let url =
        datos.url;


      // -----------------------------------------------------
      // Parámetros observados en el reproductor oficial
      // -----------------------------------------------------

      if (
        datos.tipo ===
        "application/hls+ssai"
      ) {

        url +=
          (url.includes("?")
            ? "&"
            : "?") +
          "response=200&bk-ml=1";
      }


      log(
        "URL HLS:"
      );

      log(url);


      // =====================================================
      // HLS.JS
      // =====================================================

      if (
        Hls.isSupported()
      ) {

        cambiarEstado(
          "Cargando HLS..."
        );


        const hls =
          new Hls({

            enableWorker: true,

            lowLatencyMode: false,

            backBufferLength: 30,

            maxBufferLength: 30,

            maxMaxBufferLength: 60

          });


        // ---------------------------------------------------
        // Errores
        // ---------------------------------------------------

        hls.on(
          Hls.Events.ERROR,
          function (
            event,
            data
          ) {

            console.error(
              "HLS ERROR:",
              data
            );

            log(
              "HLS ERROR: " +
              JSON.stringify(
                data,
                null,
                2
              )
            );


            if (
              data.fatal
            ) {

              cambiarEstado(
                "Error HLS: " +
                data.details
              );

            }

          }
        );


        // ---------------------------------------------------
        // Manifest loading
        // ---------------------------------------------------

        hls.on(
          Hls.Events.MANIFEST_LOADING,
          function () {

            log(
              "Cargando manifest..."
            );

          }
        );


        // ---------------------------------------------------
        // Manifest loaded
        // ---------------------------------------------------

        hls.on(
          Hls.Events.MANIFEST_LOADED,
          function () {

            log(
              "Manifest recibido."
            );

          }
        );


        // ---------------------------------------------------
        // Manifest parsed
        // ---------------------------------------------------

        hls.on(
          Hls.Events.MANIFEST_PARSED,
          function () {

            cambiarEstado(
              "Manifest cargado. Reproduciendo..."
            );


            video.play()
              .catch(
                error => {

                  log(
                    "Autoplay bloqueado: " +
                    error.message
                  );

                }
              );

          }
        );


        // ---------------------------------------------------
        // Cargar stream
        // ---------------------------------------------------

        hls.loadSource(url);

        hls.attachMedia(video);


      } else if (
        video.canPlayType(
          "application/vnd.apple.mpegurl"
        )
      ) {

        cambiarEstado(
          "Usando HLS nativo..."
        );


        video.src =
          url;


        video.addEventListener(
          "loadedmetadata",
          function () {

            log(
              "Metadatos cargados."
            );

            video.play()
              .catch(
                error => {

                  log(
                    "Autoplay bloqueado: " +
                    error.message
                  );

                }
              );

          }
        );


      } else {

        throw new Error(
          "Este navegador no soporta HLS."
        );

      }


    } catch (error) {

      console.error(
        "ERROR:",
        error
      );

      cambiarEstado(
        "ERROR: " +
        error.message
      );

      log(
        error.stack ||
        error.message
      );

    }

  }


  // =========================================================
  // ARRANCAR
  // =========================================================

  iniciar();

</script>

</body>

</html>
