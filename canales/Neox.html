<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Neox</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

#mensaje {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-family: Arial, sans-serif;
    font-size: 28px;
    text-align: center;
}
</style>
</head>

<body>

<div id="mensaje">Buscando emisión de Neox...</div>

<video id="video" controls autoplay playsinline></video>

<script>

async function iniciar() {

    const video = document.getElementById("video");
    const mensaje = document.getElementById("mensaje");

    try {

        const respuesta = await fetch(
            "https://api.atresplayer.com/client/v1/info/channels"
        );

        const datos = await respuesta.json();

        const canal = datos.find(
            item => item.link && item.link.url === "/neox/"
        );

        if (!canal) {
            throw new Error("No se encontró Neox");
        }

        const respuestaLive = await fetch(
            "https://api.atresplayer.com/player/v1/live/" +
            canal.id +
            "?NODRM=true"
        );

        const datosLive = await respuestaLive.json();

        const fuente = datosLive.sourcesLive.find(
            item => item.type === "application/vnd.apple.mpegurl"
        );

        if (!fuente) {
            throw new Error("No se encontró emisión HLS");
        }

        mensaje.style.display = "none";

        video.src = fuente.src || fuente.url;

        video.play().catch(() => {});

    } catch (error) {

        console.error(error);

        mensaje.innerText =
            "No se pudo iniciar Neox";

    }
}


// Arrancar automáticamente
iniciar();


// Volver al menú con Escape o Backspace
document.addEventListener("keydown", function(e) {

    if (e.key === "Escape" || e.key === "Backspace") {
        window.history.back();
    }

});

</script>

</body>
</html>
