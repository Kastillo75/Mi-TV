<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prueba Canal Sur</title>

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: black;

    overflow: hidden;

    font-family: Arial, sans-serif;
}


/* PANTALLA INICIAL */

#inicio {

    position: fixed;

    inset: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    background: #111;

    z-index: 10;

}


/* BOTÓN */

#boton {

    padding: 30px 60px;

    font-size: 30px;

    font-weight: bold;

    color: white;

    background: #333;

    border: 3px solid white;

    border-radius: 15px;

    cursor: pointer;

}


#boton:focus {

    outline: none;

    background: #555;

    transform: scale(1.05);

}


/* REPRODUCTOR */

#reproductor {

    position: fixed;

    inset: 0;

    display: none;

    background: black;

}


#video {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    border: 0;

}

</style>

</head>


<body>


<!-- INICIO -->

<div id="inicio">

    <button id="boton" tabindex="0">

        ▶ CANAL SUR EN DIRECTO

    </button>

</div>


<!-- REPRODUCTOR -->

<div id="reproductor"></div>


<script>


const inicio =
    document.getElementById("inicio");


const boton =
    document.getElementById("boton");


const reproductor =
    document.getElementById("reproductor");


/*
FOCO INICIAL
*/

boton.focus();


/*
INICIAR
*/

function iniciar() {


    /*
    OCULTAR BOTÓN
    */

    inicio.style.display = "none";


    /*
    MOSTRAR REPRODUCTOR
    */

    reproductor.style.display = "block";


    /*
    CREAR IFRAME AHORA,
    JUSTO DESPUÉS DE LA PULSACIÓN
    */

    const iframe =
        document.createElement("iframe");


    iframe.id = "video";


    iframe.src =
        "https://www.youtube.com/embed/live_stream?channel=UChtLgH7ZJLqLGWJpBnzy9Lg&autoplay=1&mute=0&rel=0&modestbranding=1";


    iframe.frameBorder = "0";


    iframe.allow =
        "autoplay; encrypted-media; fullscreen; picture-in-picture";


    iframe.allowFullscreen = true;


    /*
    INSERTAR
    */

    reproductor.appendChild(iframe);

}


/*
CLICK
*/

boton.addEventListener("click", function() {

    iniciar();

});


/*
ENTER / OK DEL MANDO
*/

boton.addEventListener("keydown", function(e) {

    if (e.key === "Enter") {

        e.preventDefault();

        iniciar();

    }

});


/*
ESC → VOLVER
*/

document.addEventListener("keydown", function(e) {

    if (e.key === "Escape") {

        e.preventDefault();

        window.history.back();

    }

});


</script>

</body>

</html>
